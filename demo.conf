# Recorded-demo profile.
#
# The assignment only asks the LED for two things: steady ON for 10 s after
# deployment, and a 500 ms blink while overheating. The boot "ready" flash is
# our own aid for untethered runs, so it is disabled here to keep the recorded
# demonstration free of behaviours the specification does not mention.
#
#   west build -p always -b olimex_stm32_h407 -d build/demo . -- ^
#     "-DEXTRA_CONF_FILE=demo.conf"

CONFIG_APP_READY_INDICATION=n
