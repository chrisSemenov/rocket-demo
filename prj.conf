CONFIG_GPIO=y

# BMP280 pressure/temperature sensor on I2C2 (PF1 = SCL, PF0 = SDA)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y

# Sampling: 8x pressure / 2x temperature, one conversion per 50 ms sample.
# Forced mode means each fetch triggers exactly one measurement and the sensor
# returns to sleep, so a 50 ms period contains exactly one fresh conversion
# instead of whatever normal mode last left in the data registers.
# 24.8 ms of conversion in a 50 ms period leaves ~24 ms of slack.
CONFIG_BME280_MODE_FORCED=y
CONFIG_BME280_PRESS_OVER_8X=y
CONFIG_BME280_TEMP_OVER_2X=y
# The BMP280 has no humidity sensor, but the driver's sample-time constant
# counts humidity oversampling anyway. At the default 16x it computes 53 ms,
# which exceeds the 50 ms period, so every fetch would overrun the schedule
# without any build error. At 1x the constant is 23 ms.
CONFIG_BME280_HUMIDITY_OVER_1X=y
# The IIR filter needs consecutive measurements in normal mode to smooth
# across; forced mode sleeps between conversions, so the filter is not relied
# on. The 750 ms descent window provides the averaging instead.
CONFIG_BME280_FILTER_OFF=y

# Console output over the ST-Link SWD connection via SEGGER RTT,
# because no USB-UART adapter is available.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# 8 KB rather than 2 KB: the LED self-test emits four transition lines per
# second on top of the normal telemetry, and a 2 KB buffer overran during it
# (lines were truncated mid-word). The cost is 6 KB of RAM.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
# The board defconfig enables the USART2 console, which installs its own printk
# hook at the same init priority and wins over RTT. Disable it so RTT is used.
CONFIG_UART_CONSOLE=n

# Added automatically by Workbench for Zephyr
#--- DEBUG PRESET - BEGIN ---#
# Set to -Og
CONFIG_DEBUG_OPTIMIZATIONS=y
# Thread awareness support
CONFIG_DEBUG_THREAD_INFO=y
# Generate stack usage per-function
CONFIG_STACK_USAGE=y
# Other options in case not set by default
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_META=y
CONFIG_OUTPUT_SYMBOLS=y
CONFIG_OUTPUT_STAT=y
CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
#--- DEBUG PRESET - END ---#

# Application tuning (see Kconfig). These are the values the assignment calls
# "configurable"; the 750 ms window and the 10 s / 5 s / 500 ms indication
# timings are deliberately not configurable.
CONFIG_APP_APOGEE_MIN_ALT_CM=150
CONFIG_APP_APOGEE_MIN_DESCENT_MM_S=300
# Flash twice once the system is ready, for untethered runs with no console.
CONFIG_APP_READY_INDICATION=y
