# Bench demonstration preset.
#
# Not a default. Layered on top of prj.conf when you want the detector to react
# to a deliberate hand move rather than to a real descent:
#
#   west build -p always -b olimex_stm32_h407 -d build/bench . -- ^
#     "-DEXTRA_CONF_FILE=bench.conf"
#
# Why the margin here (600) is *higher* than the flight default (300), measured
# on 2026-11-01 with the default build: raising the board by hand and holding it
# still produces a settle of 35-44 cm at about 0.36 m/s, which passes the 0.30
# margin and the 25 cm drop. That is a real decrease in the measurement, not a
# spike: both estimators agree, so no filter can separate it from a descent.
# A 0.60 margin sits above that settle, so lift-and-hold stays quiet.
#
# What still triggers: a deliberate lowering of about 0.5 m in 0.7 s is roughly
# 0.7 m/s, above 0.60. Violent sideways movement can also exceed 0.60 (measured
# excursions reach 1.19 m/s in the average and 0.73 m/s in the slope) — this
# preset is for a calm demonstration, not for shaking the board.
#
# The drop confirmation (15 cm) is non-binding here: a 0.60 m/s average over
# 750 ms already implies 45 cm of fall. It is kept low so the deliberate
# lowering is not delayed. The altitude gate is lowered to 50 cm so the board
# does not have to be held above 1.5 m.

CONFIG_APP_APOGEE_MIN_ALT_CM=50
CONFIG_APP_APOGEE_MIN_DESCENT_MM_S=600
CONFIG_APP_APOGEE_MIN_DROP_CM=15
