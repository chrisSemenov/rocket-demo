# Bench demonstration preset.
#
# Not a default. Layered on top of prj.conf when you want the detector to react
# to a hand move rather than to a real descent:
#
#   west build -p always -b olimex_stm32_h407 -d build/bench . -- ^
#     "-DEXTRA_CONF_FILE=bench.conf"
#
# Why the margin here (600) is *higher* than the flight default (300): on a
# still bench the 750 ms velocity estimate is dominated by room air drift, which
# wanders up to about 0.55 m/s and looks exactly like a slow descent. In flight
# that drift is absent and the real signal is 1-30 m/s, so a small margin is
# safe there and only delays detection.
#
# The two numbers bracket a hand move: a deliberate 0.5 m lowering in ~0.7 s is
# about 0.7 m/s (above 0.6, so it triggers), while drift stays below 0.6. The
# altitude gate is lowered to 50 cm so you do not need to stand on a chair.

CONFIG_APP_APOGEE_MIN_ALT_CM=50
CONFIG_APP_APOGEE_MIN_DESCENT_MM_S=600
CONFIG_APP_APOGEE_MIN_DROP_CM=15
